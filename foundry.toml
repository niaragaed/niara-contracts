[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 256
depth = 300
fail_on_revert = false

# Endpoints referenced by NAME in commands (--rpc-url sepolia, base_sepolia,
# robinhood_testnet, hyperevm_testnet, tempo_testnet): the five testnets the scripts' chain
# guard accepts (script/NiaraScriptBase.sol). The real values come from the local .env
# (*_RPC_URL, ETHERSCAN_API_KEY), never from here. No key of any kind is configured here: signers
# are Foundry keystores passed with --account.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
hyperevm_testnet = "${HYPEREVM_TESTNET_RPC_URL}"
tempo_testnet = "${TEMPO_TESTNET_RPC_URL}"

# Etherscan-family verification (--verify) on the two chains Etherscan API v2 covers. The
# three other testnets have no entry: Robinhood Chain and Tempo have their own explorers, and
# HyperEVM testnet has no working public explorer (see the README).
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
