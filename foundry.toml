[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 256
depth = 300
fail_on_revert = false

# Endpoints referenced by NAME in commands (--rpc-url sepolia, --rpc-url base_sepolia).
# The real values come from the local .env (SEPOLIA_RPC_URL, BASE_SEPOLIA_RPC_URL,
# ETHERSCAN_API_KEY), never from here. No private key is ever configured: signers are
# Foundry keystores passed with --account.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
